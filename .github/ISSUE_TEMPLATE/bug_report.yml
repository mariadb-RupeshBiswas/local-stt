name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems go to private reporting instead: see SECURITY.md.
        Please do not paste dictated text that you would not want public.
  - type: input
    id: version
    attributes:
      label: local-stt version
      description: Output of `local-stt --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS (Apple Silicon), Windows 11, Windows 10, Other]
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `local-stt doctor`
      render: text
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Hold the shortcut
        2. Say ...
        3. Release
    validations:
      required: true
