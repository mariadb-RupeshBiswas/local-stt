name: CI

on:
  push:
    branches: [main]
    # the PR already ran the suite; a docs-only merge has nothing new to test
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  # release.yml runs the whole suite on the exact commit it is about to publish.
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name inside a call, so a release never cancels the push run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    name: Code or docs only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # A docs-only PR skips the heavy jobs; a skipped required check counts as passed.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: sh dev/code-changed.sh | tee -a "$GITHUB_OUTPUT"

  macos:
    name: macOS (lint, test, engine)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: cargo-macos-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.gitmodules') }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked --lib --bins
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lstt-data/models
          key: model-small-ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb
      - name: Fetch the small model through the app's verified download
        env:
          LOCAL_STT_DATA_DIR: ${{ runner.temp }}/lstt-data
        run: cargo run --locked --release -- fetch-model small
      - name: Engine integration tests
        env:
          LOCAL_STT_TEST_MODEL: ${{ runner.temp }}/lstt-data/models/ggml-small-q5_1.bin
        run: cargo test --locked --release --test engine
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/voice
          key: voice-aa3cfc16963a10586a9393f5035d6d6b57e98d358b347f80c2a30bf4f00ceba2
      # Same file and checksum as src/notes/voices.rs.
      - name: Fetch the voice model by its pinned checksum
        run: |
          model="$RUNNER_TEMP/voice/model.onnx"
          mkdir -p "$RUNNER_TEMP/voice"
          [ -f "$model" ] || curl -fsSL --retry 3 -o "$model" "https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/3dspeaker_speech_campplus_sv_zh_en_16k-common_advanced.onnx"
          echo "aa3cfc16963a10586a9393f5035d6d6b57e98d358b347f80c2a30bf4f00ceba2  $model" | shasum -a 256 -c -
      - name: Voices told apart (two voices, real model)
        env:
          LOCAL_STT_TEST_VOICE_MODEL: ${{ runner.temp }}/voice/model.onnx
        run: cargo test --locked --release --test voices -- --nocapture
      - name: Start the app, load the model, quit cleanly
        env:
          LOCAL_STT_DATA_DIR: ${{ runner.temp }}/lstt-data
          LOCAL_STT_NO_PERMISSION_PROMPTS: "1"
          LOCAL_STT_EXIT_AFTER_MS: "20000"
        run: cargo run --locked --release
      - name: Show the app's own log and error output
        if: always()
        env:
          LOCAL_STT_DATA_DIR: ${{ runner.temp }}/lstt-data
        run: |
          cat "$LOCAL_STT_DATA_DIR/logs/local-stt.log" || true
          cat "$LOCAL_STT_DATA_DIR/logs/stderr.log" || true
      - name: Diagnostic report has the events and no home folder or user name
        env:
          LOCAL_STT_DATA_DIR: ${{ runner.temp }}/lstt-data
        run: |
          cargo run --locked --release -- diagnostics
          report="$(ls -t "$LOCAL_STT_DATA_DIR"/diagnostics/*.txt | head -1)"
          grep -q "local-stt diagnostic report" "$report"
          grep -q "model Whisper Small loaded" "$report"
          if grep -q -e "$HOME" -e "$USER" "$report"; then echo "report leaks the home folder or user name"; exit 1; fi

  windows:
    name: Windows (lint, test)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install the pinned Vulkan SDK (checksum verified)
        shell: pwsh
        run: ./dev/install-vulkan-sdk.ps1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            C:\t
          key: cargo-windows-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.gitmodules', 'dev/install-vulkan-sdk.ps1') }}
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked --lib --bins
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lstt-data/models
          key: model-small-ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb
      - name: Fetch the small model through the app's verified download
        env:
          LOCAL_STT_DATA_DIR: ${{ runner.temp }}/lstt-data
        run: cargo run --locked --release -- fetch-model small
      # Same transcripts as the Mac job, through the Vulkan build's CPU fallback (runners have no GPU).
      - name: Engine integration tests
        env:
          LOCAL_STT_TEST_MODEL: ${{ runner.temp }}/lstt-data/models/ggml-small-q5_1.bin
        run: cargo test --locked --release --test engine
      - name: Start the app, load the model, quit cleanly
        env:
          LOCAL_STT_DATA_DIR: ${{ runner.temp }}/lstt-data
          LOCAL_STT_NO_PERMISSION_PROMPTS: "1"
          LOCAL_STT_EXIT_AFTER_MS: "20000"
        run: cargo run --locked --release
      - name: Show the app's own log and error output
        if: always()
        shell: pwsh
        env:
          LOCAL_STT_DATA_DIR: ${{ runner.temp }}/lstt-data
        run: |
          Get-Content "$env:LOCAL_STT_DATA_DIR/logs/local-stt.log" -ErrorAction SilentlyContinue
          Get-Content "$env:LOCAL_STT_DATA_DIR/logs/stderr.log" -ErrorAction SilentlyContinue
      - name: Diagnostic report has the events and no home folder or user name
        shell: pwsh
        env:
          LOCAL_STT_DATA_DIR: ${{ runner.temp }}/lstt-data
        run: |
          cargo run --locked --release -- diagnostics
          $report = (Get-ChildItem "$env:LOCAL_STT_DATA_DIR/diagnostics/*.txt" | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          $text = Get-Content -Raw $report
          foreach ($want in @('local-stt diagnostic report', 'model Whisper Small loaded', 'power throttling: opted out', 'speech engine: CPU')) {
            if (-not $text.Contains($want)) { throw "report is missing: $want" }
          }
          if ($text.Contains($env:USERPROFILE) -or $text.Contains($env:USERNAME)) { throw "report leaks the home folder or user name" }

  version:
    name: Version files agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cargo.toml, Cargo.lock and pyproject.toml carry the same plain version
        run: sh dev/check-version.sh

  deny:
    name: cargo-deny (advisories, licenses, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.99.0"
          command: check advisories licenses sources bans

  ui:
    name: UI checks (headless Chrome)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned test dependency
        working-directory: dev/ui-tests
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run UI checks against dev/preview.html
        working-directory: dev/ui-tests
        run: npm test

  windows-e2e:
    name: Windows end-to-end (install, hotkey, pill)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install the pinned Vulkan SDK (checksum verified)
        shell: pwsh
        run: ./dev/install-vulkan-sdk.ps1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          target: x86_64-pc-windows-msvc
          maturin-version: v1.15.0
          args: --release --locked --out dist
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.22"
          enable-cache: false
      - name: Install, launch, press the shortcut, uninstall
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          ./dev/windows-e2e.ps1 -Wheel $wheel -Shots "$env:RUNNER_TEMP/e2e-shots"
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-e2e-screenshots
          path: ${{ runner.temp }}/e2e-shots
          if-no-files-found: warn
          retention-days: 14

  wheel:
    name: Wheel smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    # step-level skips: a skipped matrix job would report its name unexpanded
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install the pinned Vulkan SDK (checksum verified)
        if: runner.os == 'Windows' && needs.changes.outputs.code == 'true'
        shell: pwsh
        run: ./dev/install-vulkan-sdk.ps1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        if: needs.changes.outputs.code == 'true'
        with:
          command: build
          target: ${{ matrix.target }}
          maturin-version: v1.15.0
          args: --release --locked --out dist
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: needs.changes.outputs.code == 'true'
        with:
          version: "0.12.22"
          enable-cache: false
      - name: Run the wheel through uvx
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          wheel="$(ls dist/*.whl | head -n 1)"
          uvx --from "$wheel" local-stt --version
      # Proves the Vulkan build starts and falls back to the CPU on a PC without vulkan-1.dll.
      - name: Windows build runs without the Vulkan runtime
        if: runner.os == 'Windows' && needs.changes.outputs.code == 'true'
        shell: pwsh
        run: |
          if ($env:VULKAN_RUNTIME_FROM_SDK -eq '1') {
            Remove-Item -Force "$env:SystemRoot\System32\vulkan-1.dll", "$env:SystemRoot\SysWOW64\vulkan-1.dll" -ErrorAction SilentlyContinue
          }
          Write-Host "vulkan-1.dll present: $(Test-Path "$env:SystemRoot\System32\vulkan-1.dll")"
          $wheel = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          $out = uvx --from $wheel local-stt doctor | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "doctor failed with exit code $LASTEXITCODE" }
          if ($out -notmatch 'GPU .*\(not used\)') { throw "expected the CPU fallback on a runner without a GPU" }
      # Same script as the release, with a certificate made here, so no secret is needed.
      - name: Signed wheel installs with its signature intact (throwaway certificate)
        if: runner.os == 'macOS' && needs.changes.outputs.code == 'true'
        run: |
          work="$RUNNER_TEMP/signing"
          mkdir -p "$work"
          cp dist/*.whl "$work/"
          /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=local-stt CI throwaway" \
            -keyout "$work/key.pem" -out "$work/cert.pem" \
            -addext "keyUsage=critical,digitalSignature" -addext "extendedKeyUsage=critical,codeSigning" \
            -addext "basicConstraints=critical,CA:false"
          P12_PASSWORD="$(openssl rand -hex 16)"
          export P12_PASSWORD
          /usr/bin/openssl pkcs12 -export -inkey "$work/key.pem" -in "$work/cert.pem" \
            -out "$work/ci.p12" -passout env:P12_PASSWORD
          dev/sign-macos-wheel.sh "$(ls "$work"/*.whl | head -n 1)" "$work/ci.p12"
      - name: Keep the wheel for manual testing
        if: needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Not wheel-*: inside a release run that name would compete with the signed wheel.
          name: smoke-wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14
