name: Release

# Every merge to main runs this; only a version neither tagged nor on PyPI is published, after full CI.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: New version?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version files agree, and the version is neither tagged nor on PyPI
        id: version
        run: |
          version="$(sh dev/check-version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null
          tag_status=$?
          set -e
          if [ "$tag_status" -eq 0 ]; then
            echo "v$version is already released; nothing to publish."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$tag_status" -eq 2 ] || { echo "::error::cannot read tags (git ls-remote exit $tag_status)"; exit 1; }
          pypi_status="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/local-stt/$version/json")"
          case "$pypi_status" in
            404) echo "release=true" >> "$GITHUB_OUTPUT" ;;
            200) echo "::error::$version is on PyPI but v$version is not tagged. Re-run only the failed GitHub release job of the run that published it."; exit 1 ;;
            *) echo "::error::cannot reach PyPI (HTTP $pypi_status)"; exit 1 ;;
          esac

  ci:
    name: Full CI on this commit
    needs: check
    if: needs.check.outputs.release == 'true'
    permissions:
      contents: read
    uses: $/.github/workflows/ci.yml

  # Builds alongside CI to save time; publish below still waits for CI to pass.
  build:
    name: Build wheel (${{ matrix.target }})
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install the pinned Vulkan SDK (checksum verified)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./dev/install-vulkan-sdk.ps1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          target: ${{ matrix.target }}
          maturin-version: v1.15.0
          args: --release --locked --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  # A job of its own: the key reaches only this job, never the build that compiles dependencies.
  sign-macos:
    name: Sign the macOS app
    needs: build
    runs-on: macos-latest
    timeout-minutes: 15
    environment:
      name: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-aarch64-apple-darwin
          path: dist
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.22"
          enable-cache: false
      # Fails without the certificate: an ad-hoc release would reset everyone's permissions.
      - name: Sign with the release certificate and check an install keeps it
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          [ -n "$P12_BASE64" ] || { echo "::error::MACOS_SIGNING_P12 is not set on the pypi environment"; exit 1; }
          p12="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$p12"' EXIT
          printf '%s' "$P12_BASE64" | base64 --decode > "$p12"
          dev/sign-macos-wheel.sh "$(ls dist/*.whl | head -n 1)" "$p12" "$(cat dev/macos-signing-cert.sha1)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-aarch64-apple-darwin
          path: dist/*.whl
          if-no-files-found: error
          overwrite: true

  publish:
    name: Attest and publish to PyPI
    needs: [ci, build, sign-macos]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/local-stt
    permissions:
      id-token: write # provenance signing and PyPI trusted publishing, only after environment approval
      attestations: write # store the provenance attestation on this repo
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: src
      - name: Publish only the signed macOS wheel and the Windows wheel
        run: sh src/dev/check-release-wheels.sh dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.whl
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: GitHub release
    needs: [check, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and attach wheels
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: src
      - name: Tag the merge commit and create the release with wheels attached
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          subject=$(git -C src log -1 --format=%s "$GITHUB_SHA" | sed -E 's/ \(#[0-9]+\)$//; s/^Release //')
          title="v$VERSION"
          case "$subject" in "$VERSION: "*) title="v$subject" ;; esac
          sh src/dev/release-notes.sh "$VERSION" src/CHANGELOG.md > notes.md
          gh release create "v$VERSION" dist/*.whl --target "$GITHUB_SHA" --title "$title" --notes-file notes.md
