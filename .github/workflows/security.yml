name: Weekly security audit

# New advisories land without a code change, so re-check the lockfiles on a schedule.
on:
  schedule:
    - cron: "17 4 * * 5"
  workflow_dispatch:

permissions: {}

jobs:
  cargo:
    name: cargo-deny advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.99.0"
          command: check advisories

  npm:
    name: npm audit (dev/ui-tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # dev-only package, so no --omit=dev: that would audit nothing
      - name: npm audit
        working-directory: dev/ui-tests
        run: npm audit --audit-level=high

  whisper-release:
    name: whisper.cpp release newer than the pinned one
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open an issue when whisper.cpp has a newer release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: sh dev/check-whisper-release.sh
