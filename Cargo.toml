[package]
name = "local-stt"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Free, local, private push-to-talk speech-to-text for macOS and Windows"
repository = "https://github.com/mariadb-RupeshBiswas/local-stt"
readme = "README.md"
keywords = ["speech-to-text", "whisper", "dictation", "offline", "privacy"]
categories = ["multimedia::audio", "accessibility", "command-line-utilities"]
exclude = ["models/", "samples/", "docs/", ".github/"]

[lib]
name = "local_stt"
path = "src/lib.rs"

[[bin]]
name = "local-stt"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cmake = "0.1"
cc = "1.2"

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-clipboard-manager = "2.4"
cpal = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_SystemInformation",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
