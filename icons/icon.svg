<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6a8f"/>
      <stop offset="0.55" stop-color="#2f3a57"/>
      <stop offset="1" stop-color="#1b2236"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="mic" gradientUnits="userSpaceOnUse" x1="0" y1="236" x2="0" y2="790">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfd6e6"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ff6b5f"/>
      <stop offset="1" stop-color="#ff3b30"/>
    </radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#0b1020" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b1020" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="tileClip"><rect x="100" y="100" width="824" height="824" rx="188"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="188" fill="url(#tile)" filter="url(#drop)"/>
  <g clip-path="url(#tileClip)">
    <rect x="100" y="100" width="824" height="430" fill="url(#sheen)"/>
    <ellipse cx="512" cy="1010" rx="430" ry="190" fill="#7f95c9" opacity="0.16"/>
  </g>
  <rect x="103" y="103" width="818" height="818" rx="185" fill="none" stroke="url(#edge)" stroke-width="6"/>

  <g filter="url(#soft)">
    <rect x="422" y="236" width="180" height="326" rx="90" fill="url(#mic)"/>
    <path d="M334 502v6c0 98 80 178 178 178s178-80 178-178v-6" fill="none" stroke="url(#mic)" stroke-width="38" stroke-linecap="round"/>
    <path d="M512 686v78" fill="none" stroke="url(#mic)" stroke-width="38" stroke-linecap="round"/>
    <path d="M430 768h164" fill="none" stroke="url(#mic)" stroke-width="38" stroke-linecap="round"/>
  </g>

  <circle cx="722" cy="296" r="64" fill="#ff3b30" opacity="0.55" filter="url(#glow)"/>
  <circle cx="722" cy="296" r="42" fill="url(#dot)"/>
  <circle cx="722" cy="296" r="42" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="5"/>
</svg>
